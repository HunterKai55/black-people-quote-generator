<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Project!!!</title>
    
    <!--Link CSS Here-->
    <link rel="stylesheet" href="style.css">
    <!--Font From Google Merriweather Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!--FontAwesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Quote's From Famous Black People</h2>
        </div>

        <div class="content">
            <div class="main-content">
                <div class="text-area">
                    <span class="quote">
                        “I have learned over the years that when one's mind is made up, this diminishes fear; knowing what must be done does away with fear."
                    </span>
                </div>
                <div class="person">Rosa Parks</div>
                <div class="button-area">
                    <button id="new-quote">New Quote</button>
                </div>
            </div>

            <div class="image-content">
                <img id="quote-image" src="img/image10.jpg" alt="Quote Background">
            </div>
        </div>

    </div>
    
    <!-- Link JavaScript Here -->
    <script src="app.js"></script>
</body>
</html>
